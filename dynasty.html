<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>依朝代瀏覽｜中國文物博物館</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<link rel="stylesheet" href="assets/css/base.css?v=20261001i">
</head>
<body>

<div class="wrap">
  <nav class="topbar" id="topbar" data-active="dynasty" aria-label="網站導覽"></nav>
  <header>
    <div class="seal" aria-hidden="true"><span>歷</span><span>代</span><span>文</span><span>物</span></div>
    <div>
      <h1>依朝代瀏覽</h1>
      <p class="lede">把本站收錄的文物依年代排上時間軸，從新石器時代一路看到明代。點選長條跳到該時期，點選文物看介紹。</p>
    </div>
  </header>

  <div class="stats" id="stats"></div>

  <div class="controls">
    <div class="group" id="catG"><span class="lbl">類別</span></div>
    <input id="q" type="search" placeholder="搜尋文物、年代或博物館，例如：鼎、康王" aria-label="搜尋文物、年代或博物館">
  </div>

  <div class="tbars" id="tbars" role="navigation" aria-label="各時期文物數量"></div>

  <div class="tl" id="tl"></div>

  <footer>
    <div>分期依文物的「年代」欄位歸類；跨越兩個時期者（例如「商周」「唐末五代」「五代至北宋」）歸入起始的時期，「漢晉」歸入東漢，「先秦·秦國」石鼓歸入春秋。夏、商、西周年代採夏商周斷代工程的年表，僅供參考。</div>
  </footer>
</div>

<div class="scrim" id="scrim" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="dTitle" id="card"></div>
</div>

</body>
</html>
